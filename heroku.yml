build:
  docker:
    web: Dockerfile
release:
  image: web
  command:
    - sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py loaddata /app/docker/fixtures/ai.json /app/docker/fixtures/celery_beat.json"
run:
  web: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
  worker: celery -A config worker --loglevel=info
  beat: celery -A config beat --loglevel=info