build:
  docker:
    web: Dockerfile

release:
  image: web
  command:
    - BOOTSTRAP_SKIP_COLLECTSTATIC=1 python manage.py bootstrap

run:
  web:
    image: web
    command:
      - BOOTSTRAP_SKIP_DB=1 BOOTSTRAP_SKIP_MIGRATE=1 BOOTSTRAP_LOAD_FIXTURES=0 BOOTSTRAP_SKIP_COLLECTSTATIC=0 python manage.py bootstrap && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

  worker:
    image: web
    command:
      - celery -A config worker -B --loglevel=info --concurrency=1 --max-tasks-per-child=50