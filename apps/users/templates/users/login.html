{% extends "base.html" %}
{% block content %}
<h2>Login</h2>
<form method="post" action="{% url 'account_login' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>
<p>Don't have an account? <a href="{% url 'sign_up' %}">Register</a></p>
<p><a href="{% url 'account_reset_password' %}">Forgot password?</a></p>
{% endblock %} 
<div class="bg-white text-center p-4">Test Tailwind</div>
