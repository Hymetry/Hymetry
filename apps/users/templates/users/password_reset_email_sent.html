{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reset Email Sent</title>
        <link rel="stylesheet" href="{% static 'css/output.css' %}" />
        <link rel="icon" href="{% static 'svg/favicon.svg' %}" sizes="any" type="image/svg+xml" />
    </head>

    <body class="text-sm h-full bg-slate-50">
        <nav
            class="bg-white border-b border-gray-200 shadow-sm w-full h-12 pl-8 pr-2 flex items-center justify-between">
            <div class="flex items-center h-full">
                <img src="{% static 'svg/logo.svg' %}" />
            </div>
        </nav>
        <div class="flex flex-col items-center pt-20 text-center">
            <img src="{% static 'svg/password-reset-email-sent.svg' %}" />
            <p class="text-md my-4 text-gray-900">Check the reset password email we sent to</p>
            <p class="text-3xl font-bold text-gray-800 my-2">{{ email }}</p>
            <div class="text-sm text-center text-gray-500 mt-32">
                <a href="{% url 'password_reset_request' %}" class="font-medium text-blue-600 hover:underline">Try to reset password again</a>
            </div>
        </div>
    </body>
</html>
