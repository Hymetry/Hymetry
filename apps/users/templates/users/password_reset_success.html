{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Confirmation Sent</title>
        <link rel="stylesheet" href="{% static 'css/output.css' %}" />
        <link rel="icon" href="{% static 'svg/favicon.svg' %}" sizes="any" type="image/svg+xml" />
    </head>

    <body class="text-sm h-full bg-slate-50">
        <nav
            class="bg-white border-b border-gray-200 shadow-sm w-full h-12 pl-8 pr-2 flex items-center justify-between">
            <div class="flex items-center h-full">
                <img src="{% static 'svg/logo.svg' %}"/>
            </div>
        </nav>
        <div class="flex flex-col items-center pt-12 text-center">
            <img src="{% static 'svg/password-reset-success.svg' %}"/>
            
            <p class="text-2xl font-bold text-gray-800 mt-12">Password changed.</p>
            <div class="flex flex-col justify-center w-60 text-gray-500 pt-8">
                <a href="{% url 'sign_in' %}"
                            class="flex items-center justify-center w-full px-8 py-4 text-base text-white bg-gradient-to-br from-cyan-500 to-blue-500 rounded-lg shadow-lg shadow-cyan-500/40 transform transition-all duration-300 hover:scale-105 hover:shadow-2xl hover:shadow-cyan-500/60 mb-4">
                            Sign in
                        </a>
            </div>
        </div>
    </body>
</html>
