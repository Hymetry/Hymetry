<div id="change-tracking" data-modal-target class="hidden">
  <div class="flex items-start justify-center fixed inset-0 z-50">
    <div data-modal-close data-modal-overlay tabindex="-1" data-class-in="opacity-50" data-class-out="opacity-0" class="opacity-0 fixed inset-0 w-full z-40 transition-opacity duration-300 bg-black select-none"></div>

    <div data-modal-wrapper data-class-in="opacity-100 translate-y-0" data-class-out="opacity-0 translate-y-5" class="opacity-0 translate-y-5 z-50 w-full transition-all duration-300 transform flex flex-col overflow-hidden rounded-lg bg-white shadow-xl my-8 max-w-lg mt-52">
      <form id="change-tracking-form" action="{% url 'w:update_project_tracking' workspace_slug=project.workspace.slug project_id=project.id %}" method="POST">
        {% csrf_token %}
        <div class="bg-white px-6 py-4">
          <button type="button" data-modal-close class="absolute top-2 right-2 text-gray-400 bg-transparent hover:bg-slate-100 hover:text-slate-800 rounded w-12 h-12 ml-auto inline-flex justify-center items-center">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
              <path d="m329.08-286.54-42.54-42.54L437.46-480 286.54-629.92l42.54-42.54L480-521.54l149.92-150.92 42.54 42.54L521.54-480l150.92 150.92-42.54 42.54L480-437.46 329.08-286.54Z" />
            </svg>
          </button>

          <div class="flex items-start">
            <div class="mx-auto flex size-10 shrink-0 items-center justify-center rounded-full text-blue-500 bg-blue-100">
              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                <path d="M200-200h50.46l409.46-409.46-50.46-50.46L200-250.46V-200Zm-60 60v-135.38l527.62-527.39q9.07-8.24 20.03-12.73 10.97-4.5 23-4.5t23.3 4.27q11.28 4.27 19.97 13.58l48.85 49.46q9.31 8.69 13.27 20 3.96 11.31 3.96 22.62 0 12.07-4.12 23.03-4.12 10.97-13.11 20.04L275.38-140H140Zm620.38-570.15-50.23-50.23 50.23 50.23Zm-126.13 75.9-24.79-25.67 50.46 50.46-25.67-24.79Z" />
              </svg>
            </div>

            <div class="w-full mt-2 ml-4">
              <h3 class="text-base font-semibold leading-6">Change tracking</h3>
              <div class="mt-6">
                <p class="mb-4 text-slate-700">Select a tracking option.</p>

                <div class="space-y-4">
                  <label for="tracking-mode-analytics" class="flex items-start text-sm text-gray-700 cursor-pointer">
                    <input type="radio" name="tracking_mode" id="tracking-mode-analytics" value="analytics" {% if tracking_mode == 'analytics' %}checked{% endif %} required class="tracking-mode-radio" />
                    <span class="ml-3">
                      <span class="block font-medium text-slate-900">Analytics</span>
                      <span class="block text-sm text-slate-500">Track page views, activity, and usage patterns.</span>
                    </span>
                  </label>

                  <label for="tracking-mode-combined" class="flex items-start text-sm text-gray-700 cursor-pointer">
                    <input type="radio" name="tracking_mode" id="tracking-mode-combined" value="analytics,recording" {% if tracking_mode == 'analytics,recording' %}checked{% endif %} class="tracking-mode-radio" />
                    <span class="ml-3">
                      <span class="block font-medium text-slate-900">Analytics and screen recording</span>
                      <span class="block text-sm text-slate-500">Track page views, activity, and usage patterns, and record user sessions for replay and troubleshooting.</span>
                    </span>
                  </label>
                </div>
              </div>

              <div id="tracking-script-info" class="my-4 bg-sky-100 border border-sky-200 text-sky-800 rounded-lg p-4 hidden" role="alert">
                After saving, update the script in your app to apply these changes.
              </div>
            </div>
          </div>
        </div>

        <div class="bg-gray-50 px-6 py-3 flex flex-row-reverse gap-3">
          <button type="submit" class="flex items-center gap-2 bg-sky-600 font-medium text-white duration-150 hover:bg-sky-700 rounded px-6 py-3">Apply</button>
          <button type="button" data-modal-close class="flex items-center gap-2 font-medium text-slate-600 border border-slate-300 duration-150 hover:bg-slate-100 rounded px-4 py-3">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
