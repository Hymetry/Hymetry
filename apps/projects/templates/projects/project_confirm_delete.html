{% extends 'base.html' %}
{% block content %}
<h2>Delete Project</h2>
<p>Are you sure you want to delete the project "{{ project.name }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'project_detail' project.pk %}">Cancel</a>
</form>
{% endblock %}
