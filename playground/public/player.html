<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>rrweb Player Minimal</title>
  <link rel="stylesheet" href="https://unpkg.com/rrweb-player@latest/dist/style.css" />
  <style>
    body { margin: 0; padding: 0; background: #f9f9f9; }
    #player { max-width: 900px; margin: 40px auto; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://unpkg.com/rrweb-player@latest/dist/index.js"></script>
  <script>
    // Load events from events.txt file
    fetch('events.txt')
      .then(response => response.text())
      .then(data => {
        // Decode HTML entities and parse JSON
        const decodedData = data.replace(/&quot;/g, '"');
        const events = JSON.parse(decodedData);
        
        new rrwebPlayer({
          target: document.getElementById('player'),
          props: {
            events,
          },
        });
      })
      .catch(error => {
        console.error('Error loading events:', error);
        document.getElementById('player').innerHTML = '<p>Error loading events from events.txt</p>';
      });
  </script>
</body>
</html>
