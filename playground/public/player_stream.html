<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>rrweb Replayer — Stream + Mouse Tail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎥</text></svg>">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; background: #f6f7f9; }
    header { max-width: 960px; margin: 24px auto 0; padding: 0 16px; }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    p.sub { margin: 0; opacity: .75; font-size: .95rem; }
    #player { max-width: 960px; min-height: 420px; margin: 16px auto 32px; background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); overflow: hidden; position: relative; }
    #log { max-width: 960px; margin: 0 auto 32px; padding: 12px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); white-space: pre-wrap; }
    .controls { max-width: 960px; margin: 0 auto; padding: 0 16px 8px; display: flex; gap: 8px; align-items: center; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .spacer { flex: 1; }
    small { opacity: .7; }
    
    /* Ensure mouse tail canvas appears on top */
    .replayer-mouse-tail {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      pointer-events: none !important;
      z-index: 9999 !important;
    }
    
    /* Ensure replayer content doesn't overlap mouse tail */
    .replayer-wrapper {
      position: relative !important;
    }
  </style>
</head>
<body>
  <header>
    <h1>rrweb Replayer — потокове відтворення з mouse tail</h1>
    <p class="sub">Подаємо події порціями через <code>Replayer.addEvent()</code> у <code>liveMode</code>. Увімкнений хвіст курсора. <strong>Тепер з реальним бекендом!</strong></p>
  </header>

  <div class="controls">
    <button id="playBtn">Play</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="testMouseBtn">Test Mouse Tail</button>
    <div class="spacer"></div>
    <small>Джерело: <code>/api/sessions/:id?offset=...&limit=...</code> (пагінація з бекенду)</small>
  </div>

  <div id="player"></div>
  <div id="log" aria-live="polite"></div>

  <!-- Core rrweb (global 'rrweb' with rrweb.Replayer) -->
  <script src="https://unpkg.com/rrweb@latest/dist/rrweb.min.js"></script>
  <script>
    // Check if rrweb loaded properly
    if (typeof rrweb === 'undefined') {
      console.error('rrweb failed to load, trying alternative CDN...');
      // Fallback to alternative CDN
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js';
      script.onload = function() {
        console.log('rrweb loaded from fallback CDN');
        initializeReplayer();
      };
      script.onerror = function() {
        console.error('Failed to load rrweb from all sources');
        document.getElementById('log').textContent = 'Error: Failed to load rrweb library';
      };
      document.head.appendChild(script);
    } else {
      console.log('rrweb loaded successfully');
      initializeReplayer();
    }

    function initializeReplayer() {
      const logEl = document.getElementById('log');
      const root = document.getElementById('player');
      const playBtn = document.getElementById('playBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const testMouseBtn = document.getElementById('testMouseBtn');
      
      console.log('Button elements found:', {
        logEl: !!logEl,
        root: !!root,
        playBtn: !!playBtn,
        pauseBtn: !!pauseBtn,
        testMouseBtn: !!testMouseBtn
      });

      function log(msg) {
        const time = new Date().toLocaleTimeString();
        logEl.textContent += `[${time}] ${msg}\n`;
      }

      // Create Replayer in live mode with mouse tail
      const replayer = new rrweb.Replayer([], {
        root,
        liveMode: true,
        skipInactive: true,
        mouseTail: {
          duration: 1000,    // increased duration for better visibility
          lineWidth: 3,      // thicker line
          strokeStyle: '#ff0000', // bright red
          opacity: 0.8,      // more opaque
        },
      });
      
      // Debug: Check mouse tail canvas positioning
      setTimeout(() => {
        const mouseTailCanvas = document.querySelector('.replayer-mouse-tail');
        console.log('Mouse tail canvas found:', !!mouseTailCanvas);
        if (mouseTailCanvas) {
          console.log('Mouse tail canvas z-index:', mouseTailCanvas.style.zIndex);
          console.log('Mouse tail canvas position:', mouseTailCanvas.getBoundingClientRect());
          console.log('Mouse tail canvas style:', mouseTailCanvas.style.cssText);
        }
      }, 2000);

      playBtn.addEventListener('click', () => {
        replayer.play();
        playBtn.disabled = true;
        pauseBtn.disabled = false;
      });

      pauseBtn.addEventListener('click', () => {
        replayer.pause();
        playBtn.disabled = false;
        pauseBtn.disabled = true;
      });

      testMouseBtn.addEventListener('click', () => {
        console.log('Test mouse tail button clicked');
        alert('Button clicked!'); // Simple test
        testMouseTail();
      });

      // Test function to verify mouse tail
      function testMouseTail() {
        console.log('testMouseTail function called');
        console.log('replayer object:', replayer);
        
        const testEvent = {
          type: 3,
          data: {
            source: 1,
            positions: [
              { x: 100, y: 100, id: 999, timeOffset: 0 },
              { x: 150, y: 150, id: 999, timeOffset: -100 },
              { x: 200, y: 200, id: 999, timeOffset: -200 }
            ]
          },
          timestamp: Date.now()
        };
        
        console.log('Adding test event:', testEvent);
        replayer.addEvent(testEvent);
        log('Додано тестовий mouse event для перевірки хвоста');
        console.log('Test event added successfully');
      }

      // Configuration
      const SESSION_ID = 'demo-session-1';  // ID сесії для запиту
      const CHUNK_SIZE = 15;                // кількість подій за один запит (reduced)
      const CHUNK_DELAY_MS = 500;           // пауза між запитами (increased)

      let currentOffset = 0;
      let hasMore = true;
      let isStreaming = false;

      // Функція для завантаження чанку подій з бекенду
      async function fetchEventsChunk(offset, limit) {
        try {
          const url = `/api/sessions/${SESSION_ID}?offset=${offset}&limit=${limit}`;
          log(`Запит: ${url}`);
          
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          const data = await response.json();
          log(`Отримано ${data.events.length} подій (offset: ${data.pagination.offset}, hasMore: ${data.pagination.hasMore})`);
          
          return data;
        } catch (error) {
          console.error('Error fetching events:', error);
          log(`Помилка запиту: ${error.message}`);
          throw error;
        }
      }

      // Функція для подачі подій до replayer
      function feedEventsToReplayer(events) {
        let mouseEvents = 0;
        let mousePositions = 0;
        
        for (const event of events) {
          replayer.addEvent(event);
          
          // Debug: count mouse events
          if (event.type === 3 && event.data && event.data.source === 1) {
            mouseEvents++;
            if (event.data.positions) {
              mousePositions += event.data.positions.length;
            }
          }
        }
        log(`Додано ${events.length} подій до replayer (${mouseEvents} mouse events, ${mousePositions} positions)`);
      }

      // Основний цикл стрімінгу
      async function streamEvents() {
        if (!hasMore || isStreaming) return;
        
        isStreaming = true;
        
        try {
          // Завантажуємо чанк подій
          const data = await fetchEventsChunk(currentOffset, CHUNK_SIZE);
          
          // Подаємо події до replayer
          feedEventsToReplayer(data.events);
          
          // Оновлюємо стан пагінації
          currentOffset += data.events.length;
          hasMore = data.pagination.hasMore;
          
          // Якщо це перший чанк, запускаємо відтворення
          if (currentOffset === data.events.length) {
            replayer.play();
            playBtn.disabled = true;
            pauseBtn.disabled = false;
            log('Запущено відтворення (перший чанк містить повний snapshot)');
          }
          
          // Якщо є ще події, плануємо наступний запит
          if (hasMore) {
            setTimeout(() => {
              isStreaming = false;
              streamEvents();
            }, CHUNK_DELAY_MS);
          } else {
            log('Усі події завантажено. Відтворення триває до кінця таймлайна.');
            isStreaming = false;
          }
          
        } catch (error) {
          log(`Помилка стрімінгу: ${error.message}`);
          isStreaming = false;
        }
      }

      // Починаємо стрімінг при завантаженні сторінки
      log('Починаємо стрімінг подій з бекенду...');
      streamEvents();
    }
  </script>
</body>
</html>
