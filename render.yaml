services:
  - type: web
    name: hymetry-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    preDeployCommand: python manage.py bootstrap
    dockerCommand: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      - key: DEBUG
        value: "False"
      - key: BOOTSTRAP_SKIP_COLLECTSTATIC
        value: "1"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: hymetry-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

  - type: worker
    name: hymetry-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true

    dockerCommand: celery -A config worker -B --loglevel=info --concurrency=1 --max-tasks-per-child=50

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        fromService:
          type: web
          name: hymetry-web
          envVarKey: SECRET_KEY

      - key: DATABASE_URL
        fromDatabase:
          name: hymetry-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString


  - type: keyvalue
    name: hymetry-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []


databases:
  - name: hymetry-db
    plan: free