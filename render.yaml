services:
  - type: web
    name: hymetry-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    preDeployCommand: python manage.py bootstrap
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hymetry-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: EDGE_URL
        sync: false

  - type: worker
    name: hymetry-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    dockerCommand: celery -A config worker --loglevel=info --concurrency=1 --max-tasks-per-child=50
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hymetry-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString

  - type: worker
    name: hymetry-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    dockerCommand: celery -A config beat --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hymetry-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hymetry-redis
          property: connectionString

  - type: redis
    name: hymetry-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: hymetry-db
    plan: starter
