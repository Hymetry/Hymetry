services:
  - type: web
    name: hymetry-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: basic-1gb
    autoDeploy: true
    healthCheckPath: /
    preDeployCommand: python manage.py bootstrap

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: hymetry-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue # Updated: 'redis' is a deprecated alias
          name: hymetry-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: SITE_URL
        sync: false

      - key: APP_URL
        sync: false

      - key: EDGE_URL
        sync: false


  - type: worker
    name: hymetry-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true

    dockerCommand: celery -A config worker -B --loglevel=info --concurrency=1 --max-tasks-per-child=50

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        fromService:
          type: web
          name: hymetry-web
          envVarKey: SECRET_KEY

      - key: DATABASE_URL
        fromDatabase:
          name: hymetry-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hymetry-redis
          property: connectionString


  - type: keyvalue
    name: hymetry-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []


databases:
  - name: hymetry-db
    plan: free